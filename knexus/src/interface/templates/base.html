<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="KNexus Engine: descubre y explica conexiones entre necesidades institucionales, investigación y capacidades de la universidad, con evidencia trazable.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23251D4B'/%3E%3Ccircle cx='11' cy='16' r='4' fill='%23CADFFD'/%3E%3Ccircle cx='21' cy='10' r='4' fill='%23CCA9E8'/%3E%3Ccircle cx='21' cy='22' r='4' fill='%232FADB0'/%3E%3Cline x1='11' y1='16' x2='21' y2='10' stroke='%23FFFFFF' stroke-width='1.5'/%3E%3Cline x1='11' y1='16' x2='21' y2='22' stroke='%23FFFFFF' stroke-width='1.5'/%3E%3C/svg%3E">
<title>{% block title %}KNexus Engine{% endblock %}</title>
<link rel="stylesheet" href="/static/knexus.css">
</head>
<body>
<a class="skip-link" href="#main-content">Saltar al contenido</a>
<div class="app">
  {% include "_nav.html" %}
  <div class="app-content">
    {% if active != 'discover' %}{% include "_header.html" %}{% endif %}
    <main class="main" id="main-content">
      {% if explainer_degraded %}
        {% include "_banner.html" %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="/static/knexus.js" defer></script>
</body>
</html>
